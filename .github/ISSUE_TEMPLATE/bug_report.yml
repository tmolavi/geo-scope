name: 🐛 Bug Report
description: File a bug report to help us improve GEO-Scope
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `geo-scope run --count 1000 ...`
        2. View error at step 3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Python version, OS, browser (if Web UI bug).
      placeholder: Python 3.11, Ubuntu 24.04, Chrome 128
