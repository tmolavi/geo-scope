version: '3.8'

services:
  geo-scope:
    build: .
    container_name: geo-scope-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/benchmark_status"]
      interval: 30s
      timeout: 10s
      retries: 3
